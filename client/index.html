<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music IDL</title>
    <!-- Preconnect for faster images -->
    <link rel="preconnect" href="https://i.ytimg.com">
    <link rel="dns-prefetch" href="https://i.ytimg.com">
    <script>
      (function() {
        const theme = localStorage.getItem('theme') || 'dark';
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
    <style>
      #root:empty {
        background-color: #0a0a0a;
        background-image: 
          radial-gradient(circle at 100% 0%, rgba(249, 115, 22, 0.15), transparent 40%),
          radial-gradient(circle at 0% 100%, rgba(59, 130, 246, 0.15), transparent 40%),
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #root:empty::after {
        content: "";
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255,255,255,0.05);
        border-top-color: #ff0000;
        border-radius: 50%;
        animation: spin 0.8s cubic-bezier(0.6, 0, 0.4, 1) infinite;
        box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .dark #root:empty { background-color: #0a0a0a; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
